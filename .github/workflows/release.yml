name: release

on:
  push:
    tags: ["v*.*.*"]

permissions:
  contents: read
  packages: write

jobs:
  image:
    runs-on: ubuntu-latest
    steps:
      # "v*.*.*" accetta anche nomi sbagliati come "v.1.2.1": senza questo controllo la
      # pubblicazione fallisce più avanti senza tag dell'immagine e senza un motivo chiaro
      - name: Nome del tag (vX.Y.Z)
        run: |
          if ! echo "$GITHUB_REF_NAME" | grep -Eq '^v[0-9]+\.[0-9]+\.[0-9]+$'; then
            echo "::error::Tag '$GITHUB_REF_NAME' non valido: serve vX.Y.Z, per esempio v1.3.0 (senza punto dopo la v). Eliminare release e tag e ricrearli."
            exit 1
          fi

      - uses: actions/checkout@v5

      - uses: actions/setup-go@v6
        with: { go-version-file: go.mod }

      - name: Test Go
        run: go test ./...

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository_owner }}/totem
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{major}}

      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: VERSION=${{ steps.meta.outputs.version }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # Aggiorna la versione predefinita in docker-compose.yml sul branch principale: gli
  # stack Portainer collegati al repository (GitOps, polling) vedono il commit e si
  # ridistribuiscono con la nuova immagine. Solo dopo la pubblicazione riuscita.
  compose:
    needs: image
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.event.repository.default_branch }}

      - name: Versione predefinita nel compose
        env:
          TAG: ${{ github.ref_name }}
          BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          VER="${TAG#v}"
          sed -i -E "s#(ghcr\.io/[^:]+/totem:\\\$\{TOTEM_TAG:-)[^}]*\}#\1${VER}}#" docker-compose.yml
          grep -q "TOTEM_TAG:-${VER}}" docker-compose.yml
          if git diff --quiet; then echo "già alla versione ${VER}"; exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -am "Compose: immagine predefinita ${VER}"
          git push origin "HEAD:${BRANCH}"
