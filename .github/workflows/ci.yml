name: ci

on:
  push:
    branches: ["**"]
  pull_request:

permissions:
  contents: read

jobs:
  go:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with: { go-version-file: go.mod }
      - run: test -z "$(gofmt -l .)"
      - run: go vet ./...
      - run: go test -race ./...

  integration:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with: { go-version-file: go.mod }
      - run: chmod -R a+rX test/integration/share
      - run: docker compose -f docker-compose.test.yml up -d --wait || (sleep 10 && docker compose -f docker-compose.test.yml ps)
      - run: sleep 5 && go test -tags integration -count=1 ./test/integration/...
      - if: always()
        run: docker compose -f docker-compose.test.yml down

  web:
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: web } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm, cache-dependency-path: web/package-lock.json }
      - run: npm ci
      - run: npm test --if-present
      - run: npm run build

  e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with: { go-version-file: go.mod }
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - run: npm ci
        working-directory: web
      - run: npm ci && npx playwright install --with-deps chromium
        working-directory: test/e2e
      - run: npx playwright test
        working-directory: test/e2e
      - if: failure()
        uses: actions/upload-artifact@v4
        with: { name: e2e-report, path: test/e2e/test-results, retention-days: 7 }

  # Script del kiosk Windows (fase A) provati su un Windows vero
  windows-kiosk:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Sintassi degli script PowerShell
        shell: pwsh
        run: |
          $fail = $false
          foreach ($f in Get-ChildItem deploy/windows/*.ps1) {
            $errs = $null
            [System.Management.Automation.Language.Parser]::ParseFile($f.FullName, [ref]$null, [ref]$errs) | Out-Null
            if ($errs) { $errs | ForEach-Object { Write-Host "$($f.Name): $_" }; $fail = $true }
          }
          if ($fail) { exit 1 }

      - name: Installazione per un utente di prova
        shell: powershell
        run: |
          $pw = ConvertTo-SecureString 'Totem-Prova-2026!' -AsPlainText -Force
          New-LocalUser -Name totem -Password $pw -PasswordNeverExpires | Out-Null
          powershell -NoProfile -ExecutionPolicy Bypass -File deploy/windows/installa-kiosk.ps1 -Url https://totem.example.invalid -Utente totem
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          $t = Get-ScheduledTask -TaskName 'Totem - kiosk', 'Totem - riavvio notturno browser'
          $t | Format-Table TaskName, State, @{n='Utente';e={$_.Principal.UserId}}
          if ($t.Count -ne 2) { throw 'attività pianificate mancanti' }
          if (-not (Test-Path C:\TotemKiosk\totem-kiosk.ps1)) { throw 'watchdog non copiato' }

      - name: Il watchdog avvia Chrome e lo riapre
        shell: powershell
        run: |
          function Kiosk { @(Get-CimInstance Win32_Process -Filter "Name = 'chrome.exe'" | Where-Object { $_.CommandLine -like '*TotemKiosk*' }) }
          $w = Start-Process powershell -PassThru -ArgumentList '-NoProfile','-ExecutionPolicy','Bypass','-File','C:\TotemKiosk\totem-kiosk.ps1','-Url','about:blank','-IntervalSec','3'
          Start-Sleep -Seconds 25
          if ((Kiosk).Count -eq 0) { Get-Content C:\TotemKiosk\watchdog.log; throw 'Chrome non avviato' }
          Write-Host 'Chrome avviato con il profilo del totem'
          Stop-Process -Name chrome -Force
          Start-Sleep -Seconds 20
          if ((Kiosk).Count -eq 0) { Get-Content C:\TotemKiosk\watchdog.log; throw 'Chrome non riaperto' }
          Write-Host 'Chrome riaperto dal watchdog'
          Get-Content C:\TotemKiosk\watchdog.log
          Stop-Process -Id $w.Id -Force
          Stop-Process -Name chrome -Force -ErrorAction SilentlyContinue

  image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with: { context: ., push: false, build-args: VERSION=ci }
